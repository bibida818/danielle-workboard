<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F8F6F1">
<title>Danielle Workboard</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
:root {
  /* 奶油色系 */
  --bg: #F8F6F1;
  --bg-soft: #F2EFE8;
  --card: #FFFFFF;
  --text: #2D2A26;
  --text-soft: #6B6560;
  --text-dim: #9A948D;
  --border: #E8E4DC;
  --accent: #C9A04C;
  --accent-soft: rgba(201,160,76,0.12);

  /* 项目柔和色 */
  --project-default: #FFFFFF;
  --project-pink: #F5E6E4;
  --project-purple: #EDE6F3;
  --project-blue: #E4ECF5;
  --project-yellow: #F5F0E4;
  --project-green: #E4F0E6;

  /* 优先级 */
  --high: #D87068;
  --normal: #D9A24A;
  --low: #6BB37A;
  --done: #6BB37A;
  --done-soft: rgba(107,179,122,0.12);

  --radius: 22px;
  --radius-sm: 14px;
  --shadow: 0 4px 24px rgba(45,42,38,0.05);
  --shadow-hover: 0 8px 32px rgba(45,42,38,0.1);
  --shadow-float: 0 12px 40px rgba(45,42,38,0.15);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{height:100%}
body{
  font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','Inter',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  -webkit-user-select:none;user-select:none;
}

/* Layout */
.app{max-width:680px;margin:0 auto;padding:0 16px 110px;min-height:100vh;position:relative}

/* Header */
.app-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 12px;position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg, var(--bg) 70%, transparent);
}
.app-header .left{display:flex;align-items:center;gap:12px}
.menu-btn{
  width:38px;height:38px;border-radius:12px;background:var(--card);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--text-soft);cursor:pointer;box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{
  width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#D4A853,#C9A04C);
  display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px rgba(201,160,76,0.25);
}
.brand-text{font-size:17px;font-weight:700;letter-spacing:-0.3px}
.user-avatar{
  width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#E8D4A8,#D4A853);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;
  cursor:pointer;box-shadow:var(--shadow);
}

/* Hero Section */
.hero{padding:8px 0 20px}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.hero-greeting{font-size:13px;color:var(--text-dim);font-weight:500;margin-bottom:4px}
.hero-date{font-size:28px;font-weight:800;letter-spacing:-0.8px;line-height:1.2}
.hero-date span{display:block;font-size:13px;color:var(--text-soft);font-weight:500;letter-spacing:0}
.progress-ring-wrap{display:flex;align-items:center;gap:14px}
.progress-ring{position:relative;width:64px;height:64px;flex-shrink:0}
.progress-ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.progress-ring-bg{fill:none;stroke:var(--border);stroke-width:6}
.progress-ring-fill{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.progress-ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--accent)}
.progress-label{font-size:12px;color:var(--text-dim);font-weight:500}

/* Search */
.search-box{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 16px;margin-bottom:18px;box-shadow:var(--shadow);
}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--text)}
.search-box input::placeholder{color:var(--text-dim)}
.search-box .icon{font-size:18px;color:var(--text-dim)}

/* Filter chips */
.filter-bar{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{
  flex-shrink:0;padding:8px 16px;border-radius:20px;
  background:var(--card);border:1px solid var(--border);color:var(--text-soft);
  font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.filter-chip.active{background:var(--text);color:#fff;border-color:var(--text)}
.filter-chip .count{margin-left:6px;font-size:11px;opacity:.7}

/* Section title */
.section-title{
  font-size:13px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;
  margin:24px 0 12px;display:flex;align-items:center;justify-content:space-between;
}
.section-title .right{font-size:12px;text-transform:none;letter-spacing:0;font-weight:500}

/* Masonry grid */
.task-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:480px){.task-grid{grid-template-columns:1fr}}

/* Task cards */
.task-card{
  background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;gap:10px;
  border:1px solid transparent;
}
.task-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.task-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--accent);opacity:.6;
}
.task-card.done{opacity:.7;background:var(--bg-soft)}
.task-card.done::before{background:var(--done)}
.task-card[data-project="何刚总提车"]{background:var(--project-yellow);border-color:rgba(201,160,76,.15)}
.task-card[data-project="🚗 成都车展"]{background:var(--project-pink);border-color:rgba(216,112,104,.12)}
.task-card[data-project="🦋 闪蝶蓝"]{background:var(--project-blue);border-color:rgba(100,140,180,.12)}
.task-card[data-project="🪞 双后视镜"]{background:var(--project-purple);border-color:rgba(150,120,180,.12)}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.tag{
  font-size:10px;font-weight:700;padding:4px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px;
}
.tag.priority-high{background:rgba(216,112,104,.12);color:var(--high)}
.tag.priority-normal{background:rgba(217,162,74,.12);color:var(--normal)}
.tag.priority-low{background:rgba(107,179,122,.12);color:var(--low)}
.tag.project{background:rgba(255,255,255,.5);color:var(--text-soft)}
.tag.deadline{background:rgba(0,0,0,.05);color:var(--text-dim)}

.card-status{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  background:rgba(255,255,255,.5);transition:all .2s;
}
.card-status::after{content:'✓';font-size:14px;color:#fff;opacity:0;transition:opacity .2s;font-weight:800}
.task-card.done .card-status{background:var(--done);border-color:var(--done)}
.task-card.done .card-status::after{opacity:1}

.card-title{
  font-size:15px;font-weight:700;line-height:1.45;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.task-card.done .card-title{text-decoration:line-through;color:var(--text-soft)}

.card-note{
  font-size:12px;color:var(--text-soft);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.card-actions{display:flex;gap:6px}
.card-action{
  width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--text-soft);
  transition:background .2s;
}
.card-action:hover{background:#fff}
.card-time{font-size:11px;color:var(--text-dim);font-weight:500}

/* Swipe delete */
.task-card{position:relative;left:0;transition:left .25s,transform .2s,box-shadow .2s}
.task-card.swiped{left:-70px}
.task-swipe-delete{
  position:absolute;right:-70px;top:0;bottom:0;width:70px;
  background:var(--high);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;border-radius:0 var(--radius) var(--radius) 0;
}

/* Done divider */
.done-divider{display:flex;align-items:center;gap:10px;margin:20px 0 12px;color:var(--text-dim);font-size:12px;font-weight:600}
.done-divider::before,.done-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* Project panels (legacy structure, now styled as cards) */
#projectPanels{display:contents}
.project-panel{display:contents}
.project-header{display:none}
.project-body{display:contents}
.project-task-list{display:contents}

/* No project list */
#noProjectList{display:contents}

/* Memo */
.project-memo{display:none}

/* History */
#historySection{display:block !important}
#historyTasks .task-grid{margin-bottom:16px}

/* Empty state */
.empty-state{
  text-align:center;padding:40px 20px;color:var(--text-dim);font-size:14px;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);grid-column:1/-1;
}

/* Bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;justify-content:space-around;align-items:center;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  background:rgba(248,246,241,.92);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);z-index:100;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 16px;border-radius:14px;cursor:pointer;transition:all .2s;
  color:var(--text-dim);font-size:10px;font-weight:600;border:none;background:transparent;
}
.nav-item.active{color:var(--accent);background:var(--accent-soft)}
.nav-item .icon{font-size:22px}

/* Floating add button */
.fab{
  position:fixed;bottom:84px;right:20px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#D4A853,#C9A04C);color:#fff;border:none;
  font-size:28px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 6px 20px rgba(201,160,76,0.35);z-index:90;
  transition:transform .2s,box-shadow .2s;
}
.fab:hover{transform:scale(1.05);box-shadow:var(--shadow-float)}
.fab:active{transform:scale(.95)}

/* Drawer */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;
}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:260px;background:var(--card);
  box-shadow:var(--shadow-float);z-index:201;transform:translateX(-100%);transition:transform .3s;
  display:flex;flex-direction:column;padding:24px 16px;
}
.drawer.open{transform:translateX(0)}
.drawer-brand{display:flex;align-items:center;gap:10px;margin-bottom:30px}
.drawer-brand .brand-icon{width:40px;height:40px;border-radius:14px}
.drawer-brand .brand-text{font-size:18px}
.drawer-section{font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px}
.drawer-item{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
  cursor:pointer;color:var(--text-soft);font-size:14px;font-weight:600;transition:background .2s;
}
.drawer-item:hover{background:var(--bg)}
.drawer-item .icon{font-size:18px}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(45,42,38,.45);z-index:150;
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);
}
.modal{
  background:var(--card);width:100%;max-width:500px;max-height:85vh;overflow-y:auto;
  border-radius:var(--radius) var(--radius) 0 0;padding:24px 20px 32px;animation:slideUp .3s;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:20px;font-weight:800;margin-bottom:20px}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
.modal input,.modal select,.modal textarea{
  width:100%;padding:13px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg);font-size:15px;outline:none;color:var(--text);font-family:inherit;
}
.modal textarea{min-height:80px;resize:vertical}
.modal .btn-row{display:flex;gap:12px;margin-top:24px}
.modal .btn-row button{flex:1;padding:14px;border-radius:var(--radius-sm);border:none;font-size:15px;font-weight:700;cursor:pointer}
.modal .btn-cancel{background:var(--bg);color:var(--text-soft)}
.modal .btn-submit{background:var(--accent);color:#fff}

/* Toast */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:#2D2A26;color:#fff;padding:12px 26px;border-radius:24px;
  font-size:14px;font-weight:600;z-index:250;opacity:0;transition:opacity .3s;pointer-events:none;
}
.toast.show{opacity:1}.toast.error{background:var(--high)}

/* Sync dot */
.sync-dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--text-dim);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Responsive */
@media(max-width:480px){
  .hero-date{font-size:24px}
  .task-grid{grid-template-columns:1fr}
}
@media(min-width:681px){
  .bottom-nav{max-width:680px;left:50%;transform:translateX(-50%);border-radius:24px 24px 0 0;border:1px solid var(--border);border-bottom:none}
  .fab{right:calc(50% - 300px)}
}
</style>
</head>
<body>

<!-- Drawer -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-brand">
    <div class="brand-icon">✨</div>
    <div class="brand-text">Danielle</div>
  </div>
  <div class="drawer-section">视图</div>
  <div class="drawer-item active" onclick="switchTab('today');closeDrawer()">
    <span class="icon">📋</span> 今日看板
  </div>
  <div class="drawer-item" onclick="switchTab('stats');closeDrawer()">
    <span class="icon">📊</span> 统计洞察
  </div>
  <div class="drawer-section">工具</div>
  <div class="drawer-item" onclick="exportData();closeDrawer()">
    <span class="icon">💾</span> 导出数据
  </div>
  <div class="drawer-item" onclick="showTokenSettings();closeDrawer()">
    <span class="icon">🔐</span> 同步设置
  </div>
</div>

<div class="app">
  <!-- Header -->
  <div class="app-header">
    <div class="left">
      <button class="menu-btn" onclick="openDrawer()">☰</button>
      <div class="brand">
        <div class="brand-icon">✨</div>
        <div class="brand-text">Danielle</div>
      </div>
    </div>
    <div class="user-avatar" onclick="showTokenSettings()">D</div>
  </div>

  <!-- Hero -->
  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-greeting">Good evening</div>
        <div class="hero-date" id="heroDate">7月27日<span>周一 · 第30周</span></div>
      </div>
      <div class="progress-ring-wrap">
        <div class="progress-ring">
          <svg viewBox="0 0 64 64">
            <circle class="progress-ring-bg" cx="32" cy="32" r="28"/>
            <circle class="progress-ring-fill" id="progressRingFill" cx="32" cy="32" r="28" stroke-dasharray="175.9" stroke-dashoffset="175.9"/>
          </svg>
          <div class="progress-ring-text" id="progressPercent">0%</div>
        </div>
        <div class="progress-label"><span id="doneCount">0</span>/<span id="totalCount">0</span><br>已完成</div>
      </div>
    </div>

    <!-- Search -->
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索任务..." oninput="applyFilters()">
    </div>

    <!-- Filters -->
    <div class="filter-bar" id="filterBar">
      <div class="filter-chip active" data-filter="all" onclick="setFilter('all')">全部 <span class="count" id="filterAll">0</span></div>
      <div class="filter-chip" data-filter="pending" onclick="setFilter('pending')">待办 <span class="count" id="filterPending">0</span></div>
      <div class="filter-chip" data-filter="done" onclick="setFilter('done')">已完成 <span class="count" id="filterDone">0</span></div>
      <div class="filter-chip" data-filter="high" onclick="setFilter('high')">高优</div>
    </div>
  </div>

  <!-- Today's Tasks -->
  <div class="section-title">今日任务 <span class="right"><span id="todayBadge">0</span> 个</span></div>
  <div class="task-grid" id="todayGrid"></div>

  <!-- History Done -->
  <div class="section-title" id="historySectionTitle" style="display:none">历史已完成 <span class="right"><span id="historyBadge">0</span> 个</span></div>
  <div class="task-grid" id="historyGrid"></div>

  <!-- Stats Tab (hidden by default) -->
  <div id="statsTab" style="display:none">
    <div class="section-title">完成概览</div>
    <div class="empty-state" style="text-align:left;padding:20px">
      <div style="font-size:14px;color:var(--text-soft);margin-bottom:8px">本周完成：<strong id="statsWeekDone">0</strong> 个任务</div>
      <div style="font-size:14px;color:var(--text-soft)">高优先级完成：<strong id="statsHighDone">0</strong> 个</div>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <button class="nav-item active" data-tab="today" onclick="switchTab('today')">
    <span class="icon">📋</span>
    <span>今日</span>
  </button>
  <button class="nav-item" data-tab="stats" onclick="switchTab('stats')">
    <span class="icon">📊</span>
    <span>洞察</span>
  </button>
  <button class="nav-item" data-tab="settings" onclick="showTokenSettings()">
    <span class="icon">⚙</span>
    <span>设置</span>
  </button>
  <button class="nav-item" onclick="openAddModal('task')">
    <span class="icon">＋</span>
    <span>新建</span>
  </button>
</div>

<!-- Floating Add -->
<button class="fab" onclick="openAddModal('task')">＋</button>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle">新增任务</h3>
    <input type="hidden" id="modalTaskId">
    <input type="hidden" id="modalTargetProject">
    <label>标题</label>
    <input type="text" id="modalInput" placeholder="输入任务标题...">
    <label>所属项目</label>
    <div style="display:flex;gap:8px;align-items:center">
      <select id="modalProject" style="flex:1">
        <option value="">无项目</option>
      </select>
      <button type="button" id="modalNewProjectBtn" style="width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--accent);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="showNewProjectInput()" title="新建项目">+</button>
    </div>
    <div id="modalNewProjectWrap" style="display:none;margin-top:8px">
      <input type="text" id="modalNewProjectInput" placeholder="输入新项目名称..." style="width:100%">
    </div>
    <label>优先级</label>
    <select id="modalPriority">
      <option value="high">🔴 高优先</option>
      <option value="normal">🟡 普通</option>
      <option value="low">🟢 低优先</option>
    </select>
    <label>备注 / 链接</label>
    <textarea id="modalNote" placeholder="选填"></textarea>
    <label>Deadline（留空 = 今日待办）</label>
    <input type="date" id="modalDeadline">
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-submit" id="modalSubmit" onclick="submitModal()">确认</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
<script>
const STORAGE_PREFIX = 'danielle-board-';
const GIST_ID = '7f40c6979f2a629ac4ced78b24690e67';
const GIST_FILENAME = 'danielle-workboard-data.json';
const PRIORITY_MAP = {high:'red',normal:'yellow',low:'green'};
const PRIORITY_LABELS = {high:'高优',normal:'普通',low:'低优'};
const PRIORITY_ORDER = ['high','normal','low'];

function showToast(msg,err){

  t.textContent=msg;t.className='toast'+(err?' error':'');
  t.classList.add('show');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1500);
}

// ======== 存储（localStorage + GitHub Gist 跨设备同步） ========
function getStorageKey(date){return STORAGE_PREFIX+date}
function todayStr(){return new Date().toISOString().slice(0,10)}
function getYesterdayStr(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)}
function nextId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

// 获取 GitHub Token（从 localStorage 读取，或弹窗让用户输入）
function getGhToken(){
  if(ghToken)return ghToken;
  ghToken=localStorage.getItem('danielle-gh-token');
  if(ghToken)return ghToken;
  // 首次使用，弹窗输入
  const input=prompt('🔐 请输入 GitHub Personal Access Token（需 gist 权限）\n\n生成地址: https://github.com/settings/tokens\n勾选 gist scope 即可\n\n（仅存储在您浏览器本地，不会上传到任何服务器）');
  if(input&&input.trim()){
    ghToken=input.trim();
    localStorage.setItem('danielle-gh-token',ghToken);
    return ghToken;
  }
  return null;
}

// 同步状态指示器更新
function updateSyncDot(status){
  syncStatus=status;
  const dot=document.getElementById('syncDot');
  if(!dot)return;
  dot.className='sync-dot';
  if(status==='syncing')dot.style.background='var(--yellow)';
  else if(status==='synced')dot.style.background='var(--done)';
  else if(status==='error')dot.style.background='var(--red)';
  else dot.style.background='var(--text-dim)';
}

// 从 GitHub Gist 拉取远程数据
async function fetchRemote(){
  const token=getGhToken();
  if(!token)return null;
  try{
    const resp=await fetch(`https://api.github.com/gists/${GIST_ID}`,{
      headers:{'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github.v3+json'},
      cache:'no-store'
    });
    if(!resp.ok)return null;
    const gist=await resp.json();
    const file=gist.files&&gist.files[GIST_FILENAME];
    if(!file||!file.content)return null;
    const data=JSON.parse(file.content);
    return data&&data.tasks?data:null;
  }catch(e){return null;}
}

// 推送到 GitHub Gist
async function pushRemote(data){
  const token=getGhToken();
  if(!token)return false;
  try{
    const resp=await fetch(`https://api.github.com/gists/${GIST_ID}`,{
      method:'PATCH',
      headers:{
        'Authorization':`Bearer ${token}`,
        'Content-Type':'application/json',
        'Accept':'application/vnd.github.v3+json'
      },
      body:JSON.stringify({
        files:{[GIST_FILENAME]:{content:JSON.stringify(data,null,2)}}
      })
    });
    return resp.ok;
  }catch(e){return false;}
}

// 合并本地与远程数据（以 lastModified 为准，取最新）
function mergeData(local,remote){
  if(!remote||!remote.lastModified)return local;
  if(!local.lastModified)return remote;
  const winner=(remote.lastModified>=local.lastModified)?remote:local;
  winner.seedInjected=local.seedInjected||remote.seedInjected||false;
  return winner;
}

// 加载数据：优先远程 Gist → fallback localStorage
async function loadStorage(){
  const today=todayStr();appData.date=today;

  // 0. 初始化 token
  getGhToken();

  // 1. 尝试从 GitHub Gist 拉取
  updateSyncDot('syncing');
  const remote=await fetchRemote();

  // 2. 读取本地 localStorage
  let localData=null;
  try{
    const raw=localStorage.getItem(getStorageKey(today));
    if(raw)localData=JSON.parse(raw);
  }catch(e){}

  // 3. 合并（取最新）
  const merged=mergeData(localData,remote);
  if(merged&&merged.tasks){
    appData={date:today,tasks:merged.tasks||[],projects:merged.projects||[],memos:merged.memos||{},panelOrder:merged.panelOrder||[],migratedFrom:merged.migratedFrom||null,lastModified:merged.lastModified||0,seedInjected:merged.seedInjected||false};
    updateSyncDot(remote?'synced':'local');
    if(remote&&remote.lastModified&&(!localData||remote.lastModified>localData.lastModified)){
      localStorage.setItem(getStorageKey(today),JSON.stringify(merged));
    }
  }else if(localData){
    appData={date:today,tasks:localData.tasks||[],projects:localData.projects||[],memos:localData.memos||{},panelOrder:localData.panelOrder||[],migratedFrom:localData.migratedFrom||null,lastModified:localData.lastModified||0,seedInjected:localData.seedInjected||false};
    updateSyncDot('local');
  }else{
    updateSyncDot('local');
  }
}

// 保存数据：同时写 localStorage + GitHub Gist（带防抖）
let saveTimer=null;
function saveStorage(immediate){
  appData.lastModified=Date.now();

  // 写入 localStorage（始终立即执行）
  try{localStorage.setItem(getStorageKey(appData.date),JSON.stringify(appData))}catch(e){}

  // 写入 GitHub Gist（防抖 500ms）
  const doPush=()=>{
    const token=getGhToken();
    if(!token){updateSyncDot('local');return;}
    updateSyncDot('syncing');
    const payload={date:appData.date,tasks:appData.tasks,projects:appData.projects,memos:appData.memos,panelOrder:appData.panelOrder,migratedFrom:appData.migratedFrom,lastModified:appData.lastModified,seedInjected:appData.seedInjected};
    pushRemote(payload).then(ok=>{
      updateSyncDot(ok?'synced':'error');
    });
  };

  if(immediate){
    clearTimeout(saveTimer);
    doPush();
  }else{
    clearTimeout(saveTimer);
    saveTimer=setTimeout(doPush,500);
  }
}

function normalizeData(){
  appData.tasks=appData.tasks||[];appData.projects=appData.projects||[];
  appData.memos=appData.memos||{};appData.panelOrder=appData.panelOrder||[];
  Object.keys(appData.memos).forEach(p=>{if(!appData.projects.includes(p)&&!appData.tasks.some(t=>t.project===p))delete appData.memos[p]});
}

function autoMigrateYesterday(){
  const yesterday=getYesterdayStr();let migrated=0;
  const today=todayStr();

  // 种子数据：7月23日未完成任务，在任意>=7月24日的日期首次打开时注入
  // 用 appData 中的 seedInjected 标记（而非 localStorage），确保跨设备一致
  if(today>='2026-07-24'&&!appData.seedInjected){
    const existingIds=new Set(appData.tasks.map(t=>t.id));
    MIGRATED_FROM_0723.forEach(t=>{if(!existingIds.has(t.id)){appData.tasks.push({...t,migratedFrom:'2026-07-23'});migrated++;}});
    DONE_FROM_0723.forEach(t=>{if(!existingIds.has(t.id))appData.tasks.push({...t,migratedFrom:'2026-07-23'});});
    MIGRATED_PROJECTS_0723.forEach(p=>{if(!appData.projects.includes(p))appData.projects.push(p);if(!appData.panelOrder.includes(p))appData.panelOrder.push(p);});
    Object.entries(MIGRATED_MEMOS_0723).forEach(([p,m])=>{if(!appData.memos[p])appData.memos[p]=m;});
    appData.migratedFrom='2026-07-23';appData.seedInjected=true;
    localStorage.setItem('danielle-migrated-0723','1'); // 兼容旧标记
    saveStorage(true);
    return migrated;
  }
  // 同步旧标记到 appData
  if(localStorage.getItem('danielle-migrated-0723'))appData.seedInjected=true;

  // 日常迁移：从前一天localStorage迁移未完成任务
  const prevKey=getStorageKey(yesterday);const prevRaw=localStorage.getItem(prevKey);
  if(prevRaw){
    try{
      const yd=JSON.parse(prevRaw);const undone=yd.tasks.filter(t=>t.status!=='done');
      if(undone.length>0){
        const existingIds=new Set(appData.tasks.map(t=>t.id));
        undone.forEach(t=>{if(!existingIds.has(t.id)){appData.tasks.push({...t,status:'pending',migratedFrom:yesterday});migrated++;}});
        if(migrated>0){appData.migratedFrom=yesterday;saveStorage(true);return migrated;}
      }
    }catch(e){}
  }

  // 备选：如果localStorage没有前一天数据，但appData中还有前一天标记为pending且不在今日的任务，自动迁移
  if(migrated===0){
    const oldPending=appData.tasks.filter(t=>t.status!=='done'&&t.migratedFrom&&t.migratedFrom!==today&&t.migratedFrom!=='2026-07-23');
    // 这些是之前迁移过的，保持现状
  }

  return migrated;
}

// ======== 数据整理 ========
function getDataShape(){
  const today=todayStr();
  const allToday=appData.tasks.filter(t=>!t.deadline||t.deadline===today);
  const pending=allToday.filter(t=>t.status!=='done');
  const doneToday=allToday.filter(t=>t.status==='done');
  const historyDone=appData.tasks.filter(t=>t.status==='done'&&t.migratedFrom&&t.migratedFrom!==today);

  const projectGroups={};
  appData.projects.forEach(p=>{
    // 所有属于该项目的任务（含deadline任务）
    let tasks=appData.tasks.filter(t=>t.project===p);
    tasks.sort((a,b)=>(a.order||0)-(b.order||0));
    projectGroups[p]={tasks,memo:appData.memos[p]||''};
  });

  const noProject=appData.tasks.filter(t=>!t.project);
  noProject.sort((a,b)=>(a.order||0)-(b.order||0));

  return{date:today,project_groups:projectGroups,no_project_tasks:noProject,history_done:historyDone,total_today:allToday.length,done_today:doneToday.length};
}

// ======== 单任务操作（不重渲染） ========
function toggleTask(taskId,status){
  const t=appData.tasks.find(x=>x.id===taskId);if(!t)return;
  t.status=status==='done'?'pending':'done';saveStorage();
  // 更新单张卡片
  const card=document.querySelector(`[data-task-id="${taskId}"]`);
  if(card){card.classList.toggle('done',t.status==='done');card.dataset.status=t.status;
    const cb=card.querySelector('.checkbox');if(cb)cb.classList.toggle('done',t.status==='done');}
  refreshStats();
  showToast(t.status==='done'?'✅ 已完成':'🔄 已恢复');
}

function cyclePriority(taskId,priority){
  const t=appData.tasks.find(x=>x.id===taskId);if(!t)return;
  const idx=PRIORITY_ORDER.indexOf(priority);t.priority=PRIORITY_ORDER[(idx+1)%PRIORITY_ORDER.length];saveStorage();
  const card=document.querySelector(`[data-task-id="${taskId}"]`);
  if(card){const c=PRIORITY_MAP[t.priority];const light=card.querySelector('.priority-light');const label=card.querySelector('.priority-label');
    if(light){light.className='priority-light '+c;light.setAttribute('onclick',`event.stopPropagation();cyclePriority('${t.id}','${t.priority}')`);}
    if(label){label.className='priority-label '+c;label.textContent=PRIORITY_LABELS[t.priority];}}
  showToast(`优先级: ${PRIORITY_LABELS[t.priority]}`);
}

function saveField(taskId,field,el){
  const t=appData.tasks.find(x=>x.id===taskId);if(!t)return;
  const val=el.textContent.trim();if(!val&&field==='title'){el.textContent=t.title;return}
  t[field]=val;saveStorage();
}

function delTask(taskId){
  if(!confirm('确认删除？'))return;
  appData.tasks=appData.tasks.filter(t=>t.id!==taskId);saveStorage();
  const card=document.querySelector(`[data-task-id="${taskId}"]`);
  if(card)card.remove();
  refreshStats();checkEmptyStates();
  showToast('已删除');
}

let touchStartX=0,touchStartY=0,touchCard=null;
document.addEventListener('touchstart',function(e){
  const card=e.target.closest('.task-card');if(!card||e.target.closest('.drag-handle'))return;
  touchCard=card;touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(!touchCard)return;
  const dx=e.touches[0].clientX-touchStartX;
  const dy=e.touches[0].clientY-touchStartY;
  if(Math.abs(dy)>Math.abs(dx)){touchCard=null;return}
  if(dx<-30){touchCard.classList.add('swiped');touchCard=null;}
  else if(dx>30){touchCard.classList.remove('swiped');}
},{passive:true});
document.addEventListener('click',function(e){
  if(!e.target.closest('.task-swipe-delete')&&!e.target.closest('.task-card.swiped .task-edit-dot')){
    document.querySelectorAll('.task-card.swiped').forEach(c=>c.classList.remove('swiped'));

});

// ======== 局部刷新（进度+统计，不重渲染列表） ========
function refreshStats(){
  const d=getDataShape();
  document.getElementById('doneCount').textContent=d.done_today;
  document.getElementById('totalCount').textContent=d.total_today;
  const pct=d.total_today>0?Math.round(d.done_today/d.total_today*100):0;

  // 进度环
  const ring=document.getElementById('progressRingFill');
  if(ring){
    const circumference=2*Math.PI*28;
    ring.style.strokeDasharray=circumference;
    ring.style.strokeDashoffset=circumference*(1-pct/100);
  }
  const percentEl=document.getElementById('progressPercent');
  if(percentEl)percentEl.textContent=pct+'%';

  document.getElementById('todayBadge').textContent=d.total_today;
  const histBadge=document.getElementById('historyBadge');
  if(histBadge)histBadge.textContent=d.history_done.length;

  // 更新过滤器计数
  const allToday=d.total_today;
  const pendingCount=d.project_groups?Object.values(d.project_groups).reduce((sum,g)=>sum+g.tasks.filter(t=>t.status!=='done').length,0)+d.no_project_tasks.filter(t=>t.status!=='done').length:0;
  const doneCount=d.done_today+d.history_done.length;
  const fAll=document.getElementById('filterAll');
  const fPending=document.getElementById('filterPending');
  const fDone=document.getElementById('filterDone');
  if(fAll)fAll.textContent=allToday;
  if(fPending)fPending.textContent=pendingCount;
  if(fDone)fDone.textContent=doneCount;

  // 更新统计页
  const statsWeek=document.getElementById('statsWeekDone');
  const statsHigh=document.getElementById('statsHighDone');
  if(statsWeek)statsWeek.textContent=doneCount;
  if(statsHigh)statsHigh.textContent=appData.tasks.filter(t=>t.status==='done'&&t.priority==='high').length;
}

let currentFilter='all';

function setFilter(filter){
  currentFilter=filter;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active',c.dataset.filter===filter));
  applyFilters();
}

function applyFilters(){
  searchQuery=(document.getElementById('searchInput')?.value||'').toLowerCase();
  const cards=document.querySelectorAll('#todayGrid .task-card, #historyGrid .task-card');
  let visibleCount=0;
  cards.forEach(card=>{
    const taskId=card.dataset.taskId;
    const t=appData.tasks.find(x=>x.id===taskId);
    if(!t){card.style.display='none';return}
    const matchSearch=(t.title+' '+(t.note||'')).toLowerCase().includes(searchQuery);
    let matchFilter=true;
    if(currentFilter==='pending')matchFilter=t.status!=='done';
    else if(currentFilter==='done')matchFilter=t.status==='done';
    else if(currentFilter==='high')matchFilter=t.priority==='high';
    const show=matchSearch&&matchFilter;
    card.style.display=show?'':'none';
    if(show)visibleCount++;
  });

  // 如果没有可见卡片，显示提示
  const todayGrid=document.getElementById('todayGrid');
  const empty=todayGrid.querySelector('.empty-state');
  if(empty)empty.remove();
  if(visibleCount===0&&todayGrid.children.length===0){
    todayGrid.innerHTML='<div class="empty-state">🔍 没有匹配的任务</div>';
  }
}

  document.querySelectorAll('.drawer-item').forEach(n=>n.classList.toggle('active',n.textContent.includes(tab==='today'?'今日':'洞察')));

  const statsTab=document.getElementById('statsTab');
  const todayGrid=document.getElementById('todayGrid');
  const historyGrid=document.getElementById('historyGrid');
  const historyTitle=document.getElementById('historySectionTitle');
  if(tab==='stats'){
    if(hero)hero.style.display='none';
    document.querySelectorAll('.section-title').forEach(el=>{if(el.closest('#statsTab')===null)el.style.display='none'});
    if(todayGrid)todayGrid.style.display='none';
    if(historyGrid)historyGrid.style.display='none';
    if(historyTitle)historyTitle.style.display='none';
    if(statsTab)statsTab.style.display='block';
  }else{
    if(hero)hero.style.display='block';
    document.querySelectorAll('.section-title').forEach(el=>{if(el.closest('#statsTab')===null)el.style.display='flex'});
    if(todayGrid)todayGrid.style.display='grid';
    if(historyGrid)historyGrid.style.display='grid';
    const d=getDataShape();
    if(historyTitle)historyTitle.style.display=d.history_done.length>0?'flex':'none';
    if(statsTab)statsTab.style.display='none';
  }
}

  const projectTag=task.project?`<span class="tag project">${esc(task.project)}</span>`:'';
  const createdTime=task.created_at?(task.created_at.includes(':')?new Date(task.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''):'';
  return `<li class="${cls.join(' ')}" data-task-id="${task.id}" data-status="${task.status}" data-project="${esc(task.project||'')}">
    <div class="task-swipe-delete" onclick="event.stopPropagation();delTask('${task.id}')">🗑</div>
    <div class="card-top">
      <div class="card-tags">
        <span class="tag ${priorityClass}">${PRIORITY_LABELS[task.priority]}</span>
        ${projectTag}
        ${deadlineHtml}
      </div>
      <div class="card-status" onclick="event.stopPropagation();toggleTask('${task.id}','${task.status}')" title="点击标记完成"></div>
    </div>
    <div class="card-title" contenteditable="true" onblur="saveField('${task.id}','title',this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${esc(task.title)}</div>
    ${noteHtml}
    <div class="card-bottom">
      <div class="card-actions">
        <button class="card-action drag-handle" title="拖拽排序">≡</button>
        <button class="card-action" onclick="event.stopPropagation();openEditModal('${task.id}')" title="编辑">⋯</button>
      </div>
      <span class="card-time">${createdTime}</span>
    </div>
  </li>`;
}
function renderProjectMemo(projectName,memoText){
  const preview=memoText?memoText.replace(/\n/g,' ').substring(0,40)+(memoText.length>40?'...':''):'点击添加备忘...';
  return `<div class="project-memo"><div class="memo-toggle" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.arrow').classList.toggle('open')"><span class="arrow">▶</span> 📝 备忘 <span class="memo-preview">${esc(preview)}</span></div>
    <div class="memo-content"><textarea class="memo-editor" placeholder="输入项目备忘..." oninput="saveProjectMemo('${esc(projectName)}',this)">${esc(memoText)}</textarea><div class="memo-save-hint">自动保存</div></div></div>`;
}
function renderDoneDivider(){return '<div class="done-divider"><span>已完成</span></div>';}
function renderProjectPanel(projectName,group){
  const tasks=group.tasks||[];const memo=group.memo||'';
  const pending=tasks.filter(t=>t.status!=='done');const done=tasks.filter(t=>t.status==='done');
  let taskHtml='';if(pending.length)taskHtml+=pending.map(renderTaskCard).join('');
  if(done.length)taskHtml+=renderDoneDivider()+done.map(renderTaskCard).join('');
  return `<div class="project-panel" data-project="${esc(projectName)}">
    <div class="project-header" onclick="toggleProject(this)">
      <span class="project-drag-handle" onclick="event.stopPropagation()">⋮⋮</span>
      <span class="project-collapse open">▶</span>
      <span class="project-name" contenteditable="true" onblur="saveProjectName('${esc(projectName)}',this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}" onclick="event.stopPropagation()">${esc(projectName)}</span>
      <span class="project-stats"><span class="done-num">${done.length}</span>/<span>${tasks.length}</span></span>
    </div>
    <div class="project-body open"><ul class="sortable-list project-task-list" data-project="${esc(projectName)}">${taskHtml}</ul>${renderProjectMemo(projectName,memo)}</div>
  </div>`;
}
function toggleProject(header){
  const body=header.nextElementSibling;const arrow=header.querySelector('.project-collapse');
  body.classList.toggle('open');arrow.classList.toggle('open');
}
function renderDeadlineTasks(tasks){
  if(!tasks.length)return'<div class="empty-state">✅ 暂无远期 deadline</div>';
  const pending=tasks.filter(t=>t.status!=='done');const done=tasks.filter(t=>t.status==='done');
  return[...pending,...done].map(t=>{
    const dl=t.deadline||'',days=Math.ceil((new Date(dl)-new Date())/(864e5));
    const c=PRIORITY_MAP[t.priority]||'yellow';const isDone=t.status==='done';
    return `<div class="deadline-card${isDone?' done':''}">
      ${renderCheckbox(t)}${renderPriorityLight(t)}
      <div style="flex:1;min-width:0"><div class="task-title" contenteditable="true" onblur="saveField('${t.id}','title',this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${esc(t.title)}</div></div>
      <div class="deadline-date">${dl}</div><div class="deadline-info">${isDone?'✅ 已完成':days+'天后'}</div>
      <button class="btn-icon del" onclick="event.stopPropagation();delTask('${t.id}')" title="删除">✕</button>
    </div>`;
  }).join('');
}

// ======== 项目名/备忘保存 ========
function saveProjectName(oldName,el){
  const newName=el.textContent.trim();if(!newName||newName===oldName){el.textContent=oldName;return}
  const idx=appData.projects.indexOf(oldName);if(idx>-1)appData.projects[idx]=newName;
  appData.tasks.forEach(t=>{if(t.project===oldName)t.project=newName});
  if(appData.memos[oldName]){appData.memos[newName]=appData.memos[oldName];delete appData.memos[oldName]}
  const pIdx=appData.panelOrder.indexOf(oldName);if(pIdx>-1)appData.panelOrder[pIdx]=newName;
  saveStorage();showToast('项目已重命名');
}
let memoTimer=null;
function saveProjectMemo(project,el){clearTimeout(memoTimer);memoTimer=setTimeout(()=>{appData.memos[project]=el.value;saveStorage();},500);}

// ======== 拖拽排序 ========
let sortables=[];
function rebuildDataFromDOM(){
  const todayGrid=document.getElementById('todayGrid');
  if(!todayGrid)return;
  todayGrid.querySelectorAll('.task-card').forEach((card,idx)=>{
    const t=appData.tasks.find(x=>x.id===card.dataset.taskId);
    if(t){t.order=idx;}
  });
  saveStorage();
}

function initSortables(){
  sortables.forEach(s=>s.destroy());sortables=[];
  const todayGrid=document.getElementById('todayGrid');
  if(todayGrid&&todayGrid.querySelector('.task-card')){
    const s=new Sortable(todayGrid,{
      animation:200,handle:'.drag-handle',
      ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',
      delay:80,delayOnTouchOnly:true,
      scroll:true,scrollSensitivity:60,scrollSpeed:15,bubbleScroll:true,
      forceFallback:true,fallbackOnBody:true,
      filter:'.empty-state,.done-divider',
      onEnd:function(){rebuildDataFromDOM();showToast('顺序已保存');}
    });
    sortables.push(s);
  }
}

function buildPanelOrder(dataShape){
  const currentProjects=Object.keys(dataShape.project_groups);
  const ordered=[];
  appData.panelOrder.forEach(p=>{if(currentProjects.includes(p)&&!ordered.includes(p))ordered.push(p);});
  currentProjects.forEach(p=>{if(!ordered.includes(p))ordered.push(p);});
  if(currentProjects.some(p=>!appData.panelOrder.includes(p)))appData.panelOrder=[...ordered];
  return ordered;
}

// ======== 全量加载 ========
function fullRender(){
  try{
    const d=getDataShape();

    // Hero date
    const today=new Date();
    const hour=today.getHours();
    const greeting=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
    const greetEl=document.querySelector('.hero-greeting');
    if(greetEl)greetEl.textContent=greeting;
    const weekDays=['日','一','二','三','四','五','六'];
    const weekNum=Math.ceil(((today-new Date(today.getFullYear(),0,1))/86400000+today.getDay()+1)/7);
    const heroDate=document.getElementById('heroDate');
    if(heroDate){
      heroDate.innerHTML=`${today.getMonth()+1}月${today.getDate()}日<span>周${weekDays[today.getDay()]} · 第${weekNum}周</span>`;
    }

    const orderedProjects=buildPanelOrder(d);

    // 今日任务：按项目顺序平铺所有 pending，然后 done
    let todayHtml='';
    let hasTodayDone=false;

    orderedProjects.forEach(pn=>{
      const group=d.project_groups[pn];
      const pending=group.tasks.filter(t=>t.status!=='done');
      pending.forEach(t=>{todayHtml+=renderTaskCard(t);});
    });
    // 未归类 pending
    d.no_project_tasks.filter(t=>t.status!=='done').forEach(t=>{todayHtml+=renderTaskCard(t);});

    // 今日已完成
    orderedProjects.forEach(pn=>{
      const group=d.project_groups[pn];
      const done=group.tasks.filter(t=>t.status==='done');
      if(done.length){hasTodayDone=true;done.forEach(t=>{todayHtml+=renderTaskCard(t);});}
    });
    const npDone=d.no_project_tasks.filter(t=>t.status==='done');
    if(npDone.length){hasTodayDone=true;npDone.forEach(t=>{todayHtml+=renderTaskCard(t);});}

    const todayGrid=document.getElementById('todayGrid');
    todayGrid.innerHTML=todayHtml||'<div class="empty-state">📋 今日暂无任务<br><small style="opacity:.7">点击右下角 ＋ 新建任务</small></div>';

    // 历史已完成
    const histGrid=document.getElementById('historyGrid');
    const histSectionTitle=document.getElementById('historySectionTitle');
    if(d.history_done.length>0){
      histSectionTitle.style.display='flex';
      histGrid.innerHTML=d.history_done.map(renderTaskCard).join('');
    }else{
      histSectionTitle.style.display='none';
      histGrid.innerHTML='';
    }

    refreshStats();
    applyFilters();
    initSortables();
  }catch(e){console.error(e);}
}

// ======== 弹窗 ========
let modalMode='task';let editingTaskId=null;

function refreshProjectSelect(){
  const sel=document.getElementById('modalProject');
  const val=sel.value;
  sel.innerHTML='<option value="">无项目</option>';
  appData.projects.forEach(p=>{sel.innerHTML+=`<option value="${esc(p)}">${esc(p)}</option>`;});
  sel.value=val||'';
}

function showNewProjectInput(){
  document.getElementById('modalNewProjectWrap').style.display='block';
  document.getElementById('modalNewProjectInput').focus();
}

function openAddModal(mode){
  modalMode=mode;editingTaskId=null;
  const titleEl=document.getElementById('modalTitle');
  document.getElementById('modalInput').value='';
  document.getElementById('modalNote').value='';
  document.getElementById('modalDeadline').value='';
  document.getElementById('modalPriority').value='normal';
  document.getElementById('modalTaskId').value='';
  document.getElementById('modalNewProjectWrap').style.display='none';
  document.getElementById('modalNewProjectInput').value='';

  refreshProjectSelect();

  const projField=document.getElementById('modalProject');
  const newProjBtn=document.getElementById('modalNewProjectBtn');
  const projLabel=document.querySelectorAll('.modal label');
  const taskFields=['modalPriority','modalNote','modalDeadline'];
  const taskLabels=['优先级','备注','Deadline'];

  if(mode==='project'){
    titleEl.textContent='新建项目';document.getElementById('modalInput').placeholder='输入项目名称...';
    projField.parentElement.style.display='none';newProjBtn.style.display='none';
    projLabel.forEach(l=>{if(l.textContent.includes('所属项目'))l.style.display='none'});
    taskFields.forEach(id=>document.getElementById(id).style.display='none');
    projLabel.forEach(l=>{taskLabels.forEach(tl=>{if(l.textContent.includes(tl))l.style.display='none'})});
    document.getElementById('modalDeadline').parentElement&&(document.querySelector('label[for]')||projLabel).forEach(l=>{if(l.textContent.includes('Deadline'))l.style.display='none'});
  }else{
    titleEl.textContent='新增任务';document.getElementById('modalInput').placeholder='输入任务标题...';
    projField.parentElement.style.display='flex';newProjBtn.style.display='flex';
    projLabel.forEach(l=>{if(l.textContent.includes('所属项目'))l.style.display=''});
    taskFields.forEach(id=>document.getElementById(id).style.display='');
    projLabel.forEach(l=>{taskLabels.forEach(tl=>{if(l.textContent.includes(tl))l.style.display=''})});
    document.getElementById('modalNewProjectWrap').style.display='none';
  }
  document.getElementById('modalOverlay').style.display='flex';document.getElementById('modalInput').focus();
}

function openEditModal(taskId){
  const t=appData.tasks.find(x=>x.id===taskId);if(!t)return;
  modalMode='task';editingTaskId=taskId;
  document.getElementById('modalTitle').textContent='编辑任务';
  document.getElementById('modalInput').value=t.title||'';
  document.getElementById('modalNote').value=t.note||'';
  document.getElementById('modalDeadline').value=t.deadline||'';
  document.getElementById('modalPriority').value=t.priority||'normal';
  document.getElementById('modalTaskId').value=taskId;
  document.getElementById('modalNewProjectWrap').style.display='none';
  document.getElementById('modalNewProjectInput').value='';
  refreshProjectSelect();
  document.getElementById('modalProject').value=t.project||'';

  const projField=document.getElementById('modalProject');
  const newProjBtn=document.getElementById('modalNewProjectBtn');
  const projLabel=document.querySelectorAll('.modal label');
  const taskFields=['modalPriority','modalNote','modalDeadline'];
  const taskLabels=['优先级','备注','Deadline'];
  projField.parentElement.style.display='flex';newProjBtn.style.display='flex';
  projLabel.forEach(l=>{if(l.textContent.includes('所属项目'))l.style.display=''});
  taskFields.forEach(id=>document.getElementById(id).style.display='');
  projLabel.forEach(l=>{taskLabels.forEach(tl=>{if(l.textContent.includes(tl))l.style.display=''})});
  document.getElementById('modalNewProjectWrap').style.display='none';

  document.getElementById('modalOverlay').style.display='flex';document.getElementById('modalInput').focus();
}

function closeModal(){document.getElementById('modalOverlay').style.display='none';editingTaskId=null;}

function submitModal(){
  const title=document.getElementById('modalInput').value.trim();if(!title){showToast('请输入内容',true);return}
  if(modalMode==='project'){
    const project=title;if(appData.projects.includes(project)){showToast('项目已存在',true);return}
    appData.projects.push(project);appData.memos[project]='';if(!appData.panelOrder.includes(project))appData.panelOrder.push(project);
    saveStorage(true);showToast(`项目 "${project}" 已创建`);closeModal();fullRender();
    return;
  }

  // 检查是否有新建项目
  const newProjInput=document.getElementById('modalNewProjectInput').value.trim();
  let project=document.getElementById('modalProject').value||null;
  if(newProjInput){
    project=newProjInput;
    if(!appData.projects.includes(project)){appData.projects.push(project);appData.memos[project]='';appData.panelOrder.push(project);}
  }

  const note=document.getElementById('modalNote').value.trim();
  const deadline=document.getElementById('modalDeadline').value||null;
  const priority=document.getElementById('modalPriority').value;

  if(editingTaskId){
    const t=appData.tasks.find(x=>x.id===editingTaskId);
    if(t){t.title=title;t.priority=priority;t.note=note;t.deadline=deadline;t.project=project;}
    saveStorage(true);showToast('任务已更新');closeModal();fullRender();
  }else{
    if(project&&!appData.projects.includes(project)){appData.projects.push(project);appData.memos[project]='';appData.panelOrder.push(project);}
    appData.tasks.push({id:nextId(),title,priority,note,deadline,project,status:'pending',created_at:todayStr(),order:appData.tasks.length});
    saveStorage(true);showToast('任务已添加');closeModal();fullRender();
  }
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// ======== 启动 ========
(async function init(){
  await loadStorage();
  normalizeData();
  const migratedCount=autoMigrateYesterday();
  fullRender();
  if(migratedCount>0){setTimeout(()=>showToast(`📋 已从 ${getYesterdayStr()} 迁移 ${migratedCount} 个未完成任务`),300);}

  // 定时后台同步（每 30 秒从 Gist 拉取一次）
  setInterval(async ()=>{
    if(syncStatus==='syncing')return;
    const remote=await fetchRemote();
    if(remote&&remote.lastModified&&remote.lastModified>appData.lastModified+2000){
      if(!remote.tasks||remote.tasks.length===0)return;
      const localData={date:appData.date,tasks:appData.tasks,projects:appData.projects,memos:appData.memos,panelOrder:appData.panelOrder,migratedFrom:appData.migratedFrom,lastModified:appData.lastModified,seedInjected:appData.seedInjected};
      const merged=mergeData(localData,remote);
      if(merged.lastModified>appData.lastModified&&merged.tasks&&merged.tasks.length>0){
        appData={date:merged.date||appData.date,tasks:merged.tasks,projects:merged.projects||[],memos:merged.memos||{},panelOrder:merged.panelOrder||[],migratedFrom:merged.migratedFrom||null,lastModified:merged.lastModified,seedInjected:merged.seedInjected||appData.seedInjected};
        localStorage.setItem(getStorageKey(appData.date),JSON.stringify(appData));
        fullRender();
        updateSyncDot('synced');
        showToast('📡 已同步远程更新');
      }
    }
  },30000);
})();
</script>
